<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800" />
    <title>Collie — feature GIF template</title>
    <!-- Copy this folder to media/<id>/ and change: title, #stage content, the timeline. Rules: docs/prd/00-overview.md -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&display=block" />
    <script src="../_theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "DM Mono"; src: url("fonts/DMMono-Medium.ttf"); font-weight: 500; }
      :root {
        --bg: #15171c; --surface: #1f232b; --surface-2: #262a33; --border: #2e323b;
        --fg: #f4f2ed; --text2: #8c95b8; --accent: #6e9bff; --accent-soft: #93a4ff;
        --success: #6ee7b7; --warn: #ffb86b;
        --ui: "Manrope", system-ui, sans-serif; --mono: "DM Mono", ui-monospace, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: var(--ui); color: var(--fg);
        background-color: var(--bg); background-image: radial-gradient(circle, var(--dot, #262a33) 1.5px, transparent 1.6px); background-size: 32px 32px; }
      #stage { position: absolute; inset: 0 0 96px 0; } /* 1280×704 for the scene; the caption owns the bottom 96px */

      /* A canvas card: terminal or panel. <div class="card" style="left;top;width;height"><header><b>name</b><i>tag</i></header><div class="body">…</div></div> */
      .card { position: absolute; display: flex; flex-direction: column; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; }
      .card header { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; background: var(--surface-2); border-bottom: 1.5px solid var(--border); font-family: var(--mono); font-size: 22px; }
      .card header b { font-weight: 500; }
      .card header i { font-style: normal; color: var(--text2); }
      .card .body { flex: 1; padding: 14px; font-family: var(--mono); font-size: 22px; line-height: 32px; }
      /* Terminal lines, as on the site: prompt ›, call ↳ (accent), out (muted), reply (fg) */
      .ln { opacity: 0; white-space: nowrap; }
      .ln.prompt { color: var(--fg); } .ln.call { color: var(--accent); } .ln.out { color: var(--text2); }
      .ok { color: var(--success); } .bad { color: var(--warn); }
      /* Leash: <svg id="leashes"><path class="leash" d="…"/></svg> */
      #leashes { position: absolute; inset: 0; width: 1280px; height: 704px; pointer-events: none; }
      .leash { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 8; opacity: 0; }
      /* Owner approval card */
      .approve { position: absolute; padding: 18px 20px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 12px; font-size: 24px; font-weight: 500; opacity: 0; box-shadow: 0 16px 40px var(--shadow, rgba(0,0,0,.45)); }
      .approve small { display: block; margin-top: 4px; font-family: var(--mono); font-size: 22px; font-weight: 400; color: var(--text2); }
      .approve .btns { display: flex; gap: 10px; margin-top: 14px; }
      .approve .btn { padding: 6px 18px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 22px; font-weight: 800; }
      .approve .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #15171c); }
      /* Captions: one per beat, numbered */
      .cap { position: absolute; left: 32px; right: 32px; bottom: 20px; height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 22px;
        background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; font-size: 26px; font-weight: 500; opacity: 0; }
      .cap b { font-family: var(--mono); font-weight: 500; color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1280" data-height="800">
      <div id="app" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="stage">
          <svg id="leashes" viewBox="0 0 1280 704"><path id="l1" class="leash" d="M520 300 L760 300" /></svg>
          <div class="card" style="left: 48px; top: 120px; width: 472px; height: 360px">
            <header><b>shepherd</b><i>· claude</i></header>
            <div class="body">
              <p class="ln prompt" id="t1">› What the user asks</p>
              <p class="ln call" id="t2">↳ collie command</p>
              <p class="ln out" id="t3">its output</p>
            </div>
          </div>
          <div class="card" id="panel" style="left: 760px; top: 96px; width: 472px; height: 420px; opacity: 0">
            <header><b>panel</b><i>· kind</i></header>
            <div class="body"></div>
          </div>
        </div>
        <div class="cap" id="c1"><b>1</b>First beat.</div>
        <div class="cap" id="c2"><b>2</b>Second beat.</div>
        <div class="cap" id="c3"><b>3</b>Third beat.</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const show = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t);
      const hide = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.2 }, t);
      const cap = (id, prev, t) => { if (prev) hide(prev, t); show(id, t); };

      cap("#c1", null, 0.3); show("#t1", 0.6);
      cap("#c2", "#c1", 3.0); show("#t2", 3.2); show("#panel", 3.6); show("#l1", 3.9);
      cap("#c3", "#c2", 6.0); show("#t3", 6.3);
      // Hold the last second still; the loop restarts from the empty state.
      tl.to({}, { duration: 0.01 }, 10);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
